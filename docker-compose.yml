services:
  nfl-grabber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfl-torrent-grabber
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Reach host/LAN ports directly (e.g. http://host.docker.internal:8087)
    extra_hosts:
      - "host.docker.internal:host-gateway"

